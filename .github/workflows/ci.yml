name: CI and deployment
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
# Only superseded PR runs are cancelled. Protected-branch runs and deployments finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build and test once
        run: tools/dev/run.sh sh -c 'npm ci && npm run test:rust && npm run build && npm test'
      - name: Validate deployment bundle
        run: tools/dev/run.sh npx --yes wrangler@4.156.2 deploy --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Download artifact for compatibility check
        uses: actions/download-artifact@v8
        with:
          name: production-dist
          path: ${{ runner.temp }}/dist-roundtrip
      - name: Verify deployment artifact round trip
        run: diff -qr dist "$RUNNER_TEMP/dist-roundtrip"
      - name: Package generated source dependencies
        run: tar -czf generated-source.tar.gz src/wasm src/generated
      - uses: actions/upload-artifact@v7
        with:
          name: generated-source
          path: generated-source.tar.gz
          if-no-files-found: error
          retention-days: 7

  browsers:
    name: Browser / ${{ matrix.browser }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: production-dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: generated-source
      - run: tar -xzf generated-source.tar.gz
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Production browser tests
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Source-module browser tests
        run: npx playwright test --config playwright.dev.config.ts --project=${{ matrix.browser }}
      - name: Browser reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-reports-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  manual:
    name: Manual illustrations
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: production-dist
          path: dist
      - name: Verify illustrations in the reference container
        run: tools/dev/run.sh manual-check
      - name: Manual reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-reports-manual
          path: |
            test-results/manual/
            playwright-report/manual/
          if-no-files-found: ignore
          retention-days: 7

  check:
    name: Build and test
    if: always()
    needs: [build, browsers, manual]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      BROWSER_RESULT: ${{ needs.browsers.result }}
      MANUAL_RESULT: ${{ needs.manual.result }}
    steps:
      - name: Require every validation job to succeed
        run: |
          test "$BUILD_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$MANUAL_RESULT" = success
  deploy:
    name: Deploy production
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check this is still the latest release
        id: latest
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.latest.outputs.deploy == 'true'
        with:
          name: production-dist
          path: dist
      - uses: actions/setup-node@v7
        if: steps.latest.outputs.deploy == 'true'
        with:
          node-version: 22
      - name: Deploy tested assets
        if: steps.latest.outputs.deploy == 'true'
        run: npx --yes wrangler@4.156.2 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
