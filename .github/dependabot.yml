version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # Node typings match the Node 22 build/runtime environment.
    # vue-tsc currently imports TypeScript's JS implementation, absent in TS 7.
    ignore:
      # Firefox file chooser cancellation regression: microsoft/playwright#43994.
      - dependency-name: '@playwright/test'
        versions: ['1.65.x']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        versions: ['>=7.0.0']
    groups:
      npm-dependencies:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /crates/document
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
